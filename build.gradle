import org.codehaus.groovy.runtime.IOGroovyMethods

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        // JCenter (Bintray) was permanently shut down; the artifacts this project depends on
        // are mirrored on Google's Maven repo and Maven Central instead. Gradle 3.5 predates
        // the google() repository shorthand (added in Gradle 4.1), so use its URL directly.
        maven { url "https://maven.google.com" }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        // com.android.tools.build:gradle:2.3.1 and io.realm:realm-gradle-plugin:3.1.1 predate
        // Google's Maven repo taking over AGP distribution and were only ever published to the
        // now-dead JCenter. This is a community mirror that still carries old JCenter artifacts.
        maven { url "https://maven.aliyun.com/repository/jcenter" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.3.1'
        classpath "io.freefair.gradle:android-gradle-plugins:2.3.1"
        classpath "io.freefair.gradle:gradle-plugins:0.10.1"
        classpath "io.realm:realm-gradle-plugin:3.1.1"
    }
}

allprojects {
    repositories {
        maven { url "https://maven.google.com" }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    if (System.getenv("BLDZR_BUILD_NUMBER") != null) {
        exec('git fetch origin --unshallow --tags -v')
    }

    apply plugin: 'io.freefair.git-version'
    gitTagPrefix = 'v'

}

private void exec(String cmd) {
    println "EXEC: $cmd"
    def process = cmd.execute([], project.rootDir)
    String text = IOGroovyMethods.getText(new BufferedReader(new InputStreamReader(process.getInputStream())));
    String err = IOGroovyMethods.getText(new BufferedReader(new InputStreamReader(process.getErrorStream())));
    process.closeStreams();
    println text
    println err
    println "FINISHED: $cmd"
    println ""
}
