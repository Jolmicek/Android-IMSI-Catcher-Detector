name: Build debug APK

on:
  push:
    branches:
      - fix/ber-parseint-crash
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # android-actions/setup-android bundles a recent `sdkmanager` that requires JDK 17+ just
      # to accept the SDK licenses, so it must run under JDK 17 even though the actual Gradle
      # build below needs JDK 8 for this project's old AGP/Gradle versions.
      - name: Set up JDK 17 (for the Android SDK manager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-25 build-tools;25.0.2 platform-tools'

      - name: Set up JDK 8 (for the Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build normal-flavor debug APK
        run: ./gradlew assembleNormalDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMSICD-normal-debug-apk
          path: AIMSICD/build/outputs/apk/**/*.apk
          if-no-files-found: error
